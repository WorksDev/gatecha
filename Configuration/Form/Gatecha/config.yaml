name: itw/gatecha
label: 'GateCHA'
priority: 150

prototypes:
  standard:
    formElementsDefinition:
      Form:
        renderingOptions:
          partialRootPaths:
            1792200000: 'EXT:gatecha/Resources/Private/Frontend/Partials/'

      Gatecha:
        implementationClassName: TYPO3\CMS\Form\Domain\Model\FormElements\GenericFormElement
        renderingOptions:
          templateName: Gatecha
          _isCompositeFormElement: true
        properties:
          containerClassAttribute: 'form-element form-element-gatecha mb-3'
          elementClassAttribute: ''
          elementErrorClassAttribute: error
        validators:
          - identifier: Gatecha
        formEditor:
          label: 'LLL:EXT:gatecha/Resources/Private/Language/locallang.xlf:element.label'
          group: custom
          groupSorting: 1000
          iconIdentifier: form-hidden
          predefinedDefaults: {}
          editors:
            100:
              identifier: header
              templateName: Inspector-FormElementHeaderEditor
            200:
              identifier: label
              templateName: Inspector-TextEditor
              label: formEditor.elements.FormElement.editor.label.label
              propertyPath: label
            9999:
              identifier: removeButton
              templateName: Inspector-RemoveElementEditor

    validatorsDefinition:
      Gatecha:
        implementationClassName: Itw\Gatecha\Validation\GatechaValidator
